<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downlink 下载接管</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: Canvas; color: CanvasText; }
    main { width: min(560px, 100%); padding: 24px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 16px; background: color-mix(in srgb, Canvas 95%, CanvasText 5%); box-shadow: 0 12px 30px color-mix(in srgb, CanvasText 10%, transparent); }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 8px 0; line-height: 1.55; }
    #url { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, CanvasText 7%, transparent); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    button { border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 10px; padding: 9px 14px; background: ButtonFace; color: ButtonText; cursor: pointer; }
    #openBtn { background: #ff9500; border-color: transparent; color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">正在交给 Downlink…</h1>
    <p id="status">正在读取被重定向的下载地址。</p>
    <p id="url"></p>
    <div class="actions">
      <button id="openBtn" type="button" hidden>打开 Downlink</button>
      <button id="backBtn" type="button">返回上一页</button>
    </div>
  </main>
  <script src="dnr-capture.js"></script>
</body>
</html>
