<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Aria2 任务管理 - Downlink</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light dark;
      --bg:        #f5f4f0;
      --bg2:       #ffffff;
      --bg3:       #eeede9;
      --bg4:       #e6e5e1;
      --border:    #dddcda;
      --text:      #1c1b19;
      --text-2:    #5a5955;
      --text-3:    #9b9a97;
      --accent:    #e05c2a;
      --accent-bg: #fdf0eb;
      --accent-bd: #f5c8b4;
      --green:     #2a9d5c;
      --green-bg:  #edf7f2;
      --green-bd:  #a8dfc0;
      --blue:      #2563eb;
      --blue-bg:   #eff4ff;
      --blue-bd:   #bfcffd;
      --red:       #dc2626;
      --red-bg:    #fff1f1;
      --yellow:    #d97706;
      --yellow-bg: #fffbeb;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
      --header-h:  58px;
      --toolbar-h: 52px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #1e2025;
        --bg2:       #262a31;
        --bg3:       #2f343d;
        --bg4:       #3a404a;
        --border:    rgba(255,255,255,0.14);
        --text:      #f5f4f2;
        --text-2:    #d5d3ce;
        --text-3:    #a5a39d;
        --accent:    #ff8a5c;
        --accent-bg: #42271e;
        --accent-bd: #75402d;
        --green:     #5bd58d;
        --green-bg:  #1c3929;
        --green-bd:  #356e4d;
        --blue:      #7ca8ff;
        --blue-bg:   #202f50;
        --blue-bd:   #405d99;
        --red:       #ff8e8e;
        --red-bg:    #442426;
        --yellow:    #f5bd58;
        --yellow-bg: #423719;
        --shadow:    0 10px 28px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.10);
      }
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 650;
      min-width: 0;
    }
    .header-title img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .header-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-2);
      white-space: nowrap;
      margin-left: 4px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
    .status-dot.bad { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
    .status-dot.checking { background: var(--yellow); }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      white-space: nowrap;
      font-size: 12px;
    }
    .stat .stat-value {
      font-weight: 650;
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }
    .stat .stat-label { color: var(--text-3); }
    .stat.speed { background: var(--accent-bg); border-color: var(--accent-bd); }
    .stat.speed .stat-value { color: var(--accent); }
    .stat.up .stat-value { color: var(--blue); }

    /* ── Toolbar ────────────────────────────── */
    .toolbar {
      height: var(--toolbar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .filters {
      display: flex;
      gap: 3px;
      background: var(--bg3);
      border-radius: 9px;
      padding: 3px;
      flex-shrink: 0;
    }
    .filter-btn {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active {
      background: var(--bg2);
      color: var(--text);
      font-weight: 600;
    }
    .filter-btn .count {
      opacity: 0.6;
      margin-left: 3px;
      font-weight: 400;
      font-size: 11.5px;
    }
    .search {
      flex: 1;
      min-width: 140px;
      max-width: 300px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
    }
    .search svg {
      width: 14px;
      height: 14px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .search input {
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      width: 100%;
      padding: 1px 0;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 12.5px;
      border-radius: 8px;
      padding: 5px 11px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--bg4); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
    .btn.danger { color: var(--red); border-color: var(--red-bd); background: var(--red-bg); }
    .btn svg { width: 13px; height: 13px; }
    /* ── Alert ──────────────────────────────── */
    .alert {
      display: none;
      margin: 10px 18px 0;
      padding: 9px 12px;
      border-radius: 9px;
      background: var(--red-bg);
      border: 1px solid var(--red-bd);
      color: var(--red);
      font-size: 13px;
      line-height: 1.45;
      flex-shrink: 0;
    }
    .alert.show { display: block; }
    .toast {
      position: fixed;
      bottom: 46px;
      left: 50%;
      z-index: 100;
      max-width: 80vw;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity .2s;
    }
    .toast.show { opacity: 1; }

    /* ── Main layout ────────────────────────── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 42%);
      min-height: 0;
      position: relative;
    }
    .list-panel {
      min-width: 0;
      overflow-y: auto;
      padding: 12px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-3);
      font-size: 12px;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .list-meta-primary { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
    .selection-summary { color: var(--accent); font-weight: 600; }

    /* ── Task table ─────────────────────────── */
    .task-table {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.1s, border-color 0.1s;
      min-width: 0;
    }
    .task-row:hover { background: var(--bg3); }
    .task-select {
      position: relative;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .task-select input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .task-check {
      width: 17px;
      height: 17px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg2);
      transition: background .12s, border-color .12s;
    }
    .task-select input:focus-visible + .task-check { outline: 2px solid var(--accent-bd); outline-offset: 2px; }
    .task-select input:checked + .task-check {
      border-color: var(--accent);
      background: var(--accent);
    }
    .task-select input:checked + .task-check::after {
      content: '';
      display: block;
      width: 4px;
      height: 8px;
      margin: 2px 0 0 5px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .task-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .task-icon img { width: 20px; height: 20px; object-fit: contain; }
    .task-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-name {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-sub {
      display: flex;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
    }
    .task-progress {
      width: 190px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--bg4);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .progress-fill.done { background: var(--green); }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }
    .progress-meta .speed { color: var(--accent); }
    .task-actions {
      display: none;
      gap: 4px;
      flex-shrink: 0;
    }
    .task-row:hover .task-actions, .task-row.selected .task-actions { display: inline-flex; }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text-2);
      border-radius: 7px;
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }
    .icon-btn:hover { color: var(--text); background: var(--bg4); }
    .icon-btn.danger:hover { color: var(--red); border-color: var(--red-bd); background: var(--red-bg); }
    .icon-btn svg { width: 13px; height: 13px; }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
      font-weight: 500;
      width: 56px;
      text-align: center;
      display: inline-block;
    }
    .status-active     { color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue-bd); }
    .status-waiting    { color: var(--yellow); background: var(--yellow-bg); border: 1px solid var(--yellow-bd); }
    .status-paused     { color: var(--text-2); background: var(--bg3); border: 1px solid var(--border); }
    .status-complete   { color: var(--green); background: var(--green-bg); border: 1px solid var(--green-bd); }
    .status-error      { color: var(--red); background: var(--red-bg); border: 1px solid var(--red-bd); }
    .status-removed    { color: var(--text-3); background: var(--bg3); border: 1px solid var(--border); }

    /* ── Empty ──────────────────────────────── */
    .empty {
      background: var(--bg2);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 34px 16px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      line-height: 1.7;
    }
    .empty img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      opacity: 0.75;
      margin-bottom: 8px;
    }

    /* ── Detail drawer ──────────────────────── */
    .detail-panel {
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .detail-header h2 {
      font-size: 14.5px;
      font-weight: 650;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail-close {
      display: none;
      border: none;
      background: var(--bg3);
      color: var(--text-2);
      border-radius: 7px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12.5px;
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      font-size: 13px;
    }
    .detail-body::-webkit-scrollbar,
    .file-item .uris::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .detail-section-title {
      font-size: 11.5px;
      font-weight: 650;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .detail-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .detail-section-heading .detail-section-title { margin-bottom: 0; }
    .detail-copy-links {
      flex-shrink: 0;
      padding: 3px 7px;
      font-size: 11px;
      border-radius: 6px;
    }
    .detail-progress-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 9px;
    }
    .detail-progress-card {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg3);
    }
    .detail-progress-ring {
      position: relative;
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
    }
    .detail-progress-ring svg {
      display: block;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .detail-progress-ring circle {
      fill: none;
      stroke-width: 3.5;
    }
    .detail-progress-ring .ring-track { stroke: var(--bg4); }
    .detail-progress-ring .ring-value {
      stroke: var(--ring-color, var(--accent));
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: calc(100 - var(--ring-progress, 0));
      transition: stroke-dashoffset .3s ease;
    }
    .detail-progress-ring.unavailable .ring-value { stroke: var(--text-3); opacity: .35; }
    .detail-progress-ring .ring-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .detail-progress-ring.unavailable .ring-center { color: var(--text-3); }
    .detail-progress-copy { min-width: 0; }
    .detail-progress-label {
      color: var(--text-2);
      font-size: 11.5px;
      font-weight: 650;
    }
    .detail-progress-detail {
      margin-top: 3px;
      color: var(--text-3);
      font-size: 10.5px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .uri-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 1px;
    }
    .uri-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg3);
    }
    .uri-link {
      display: block;
      min-width: 0;
      flex: 1;
      color: var(--blue);
      font-size: 11.5px;
      line-height: 1.45;
      overflow: hidden;
      overflow-wrap: normal;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: normal;
      text-decoration: none;
    }
    .uri-link:hover { color: var(--accent); }
    .copy-link {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      color: var(--text-3);
      border-radius: 6px;
    }
    .copy-link svg { width: 12px; height: 12px; }
    .copy-link:hover { color: var(--text); }
    .kv {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 6px 12px;
      line-height: 1.55;
      font-size: 12.5px;
    }
    .kv dt { color: var(--text-3); white-space: nowrap; }
    .kv dd { min-width: 0; overflow-wrap: anywhere; word-break: break-all; }
    .gid {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--text-2);
      cursor: copy;
      user-select: all;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }
    .file-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--bg3);
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .file-item .path {
      font-size: 12.5px;
      overflow-wrap: anywhere;
      word-break: break-all;
      font-weight: 550;
    }
    .file-item .file-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .file-item .uris {
      font-size: 11.5px;
      color: var(--text-3);
      overflow-wrap: anywhere;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .detail-actions .btn { font-size: 12.5px; padding: 6px 12px; }
    .detail-actions .spacer { flex: 1; }

    /* ── Footer ─────────────────────────────── */
    .footer {
      height: 34px;
      flex-shrink: 0;
      padding: 0 18px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text-3);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      white-space: nowrap;
    }
    .footer .spacer { flex: 1; }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 860px) {
      .main { grid-template-columns: minmax(0, 1fr); }
      .detail-panel {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 30;
        border-left: none;
        display: none;
        width: 100%;
      }
      .detail-panel.open { display: flex; }
      .detail-close { display: inline-block; }
      .task-progress { width: 150px; }
      .header-stats { display: none; }
      .toolbar { flex-wrap: wrap; height: auto; padding: 8px 14px; gap: 8px; }
      .search { max-width: none; }
      .toolbar-actions { margin-left: 0; }
      .list-panel { padding: 10px 12px; }
      .stat { display: none; }
    }

    .hidden { display: none !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: var(--text-3); }
    .settings-dialog {
      width: min(520px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 16px;
      background: var(--bg2); color: var(--text); padding: 0; box-shadow: 0 28px 70px rgba(0,0,0,.48);
    }

      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .main.has-detail .list-panel {
      --task-grid-columns: 18px 44px minmax(180px, 1fr) 82px 58px minmax(118px, 132px) 88px;
      --task-grid-gap: 8px;
      --task-grid-padding-x: 12px;
      padding-right: 14px;
      padding-left: 14px;
    }
    .main.has-detail .task-row .task-icon { width: 42px; height: 42px; }
    .main.has-detail .task-created-time { font-size: 11px; }
    .main.has-detail .task-actions { gap: 2px; }
    .main.has-detail .icon-btn { width: 26px; height: 26px; }
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 0 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .queue-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; margin-left: 0; margin-right: auto; }
    .queue-actions .btn { height: 34px; padding: 0 11px; border-radius: 9px; }
    .queue-actions .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .queue-actions .btn.danger { color: var(--red); background: transparent; border-color: transparent; }
    .list-meta { padding: 0 2px 8px; }
    .task-table {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      gap: 0;
    }
    .task-table::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .task-table-header {
      position: relative;
      top: auto;
      flex: 0 0 auto;
      z-index: 4;
      display: grid;
      grid-template-columns: var(--task-grid-columns);
      align-items: center;
      column-gap: var(--task-grid-gap);
      min-height: 44px;
      padding: 9px var(--task-grid-padding-x) 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      box-shadow: none;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.35;
      white-space: nowrap;
    }
    .task-header-name { grid-column: 3; }
    .task-header-speed { grid-column: 4; justify-self: center; text-align: center; }
    .task-header-status { grid-column: 5; justify-self: center; text-align: center; }
    .task-header-created-time { grid-column: 6; justify-self: center; text-align: center; }
    .task-header-actions { grid-column: 7; justify-self: center; text-align: center; }
    .task-row {
      display: grid;
      grid-template-columns: var(--task-grid-columns);
      align-items: center;
      column-gap: var(--task-grid-gap);
      min-height: 88px;
      padding: 13px var(--task-grid-padding-x);
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transform: none !important;
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: var(--bg3); border-color: transparent; }
    .task-row.selected,
    .task-row.selected:hover {
      background: var(--accent-bg);
      border-color: transparent;
      border-bottom-color: var(--border);
    }
    .task-row .task-icon { width: 48px; height: 48px; border-radius: 12px; background: transparent; border: 0; box-shadow: none; }
    .task-icon img { width: 100%; height: 100%; object-fit: contain; }
    .task-select { grid-column: 1; }
    .task-row .task-icon { grid-column: 2; }
    .task-info { grid-column: 3; align-self: stretch; justify-content: center; gap: 6px; }
    .task-name { font-size: 13.5px; }
    .task-sub { font-size: 11.5px; }
    .task-sub:empty { display: none; }
    .task-progress { width: 100%; max-width: none; min-width: 0; gap: 7px; margin-top: 0; }
    .progress-track { height: 6px; background: var(--bg3); }
    .progress-meta { font-size: 11.5px; }
    .progress-meta .eta { color: var(--text-2); white-space: nowrap; }
    .task-created-time {
      grid-column: 6;
      justify-self: center;
      min-width: 0;
      color: var(--text-2);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-traffic { grid-column: 4; display: flex; flex-direction: column; align-items: center; justify-self: center; gap: 7px; min-width: 0; font-size: 11.5px; font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
    .traffic-down { color: var(--blue); }
    .traffic-up { color: var(--green); }
    .status-badge { grid-column: 5; order: 0; justify-self: center; width: 62px; min-width: 62px; padding: 5px 0; border-radius: 8px; text-align: center; }
    .task-actions { grid-column: 7; order: 0; display: inline-flex; gap: 4px; justify-content: center; justify-self: center; }
    .icon-btn { width: 28px; height: 28px; background: transparent; }
    .icon-btn:hover { background: var(--bg3); }

    @media (max-width: 1280px) {
      .queue-header { align-items: flex-start; flex-direction: column; }
      .queue-header .queue-actions { width: 100%; justify-content: flex-start; }
      .list-panel {
        --task-grid-columns: 18px 48px minmax(220px, 1fr) 84px 58px minmax(128px, 148px) 96px;
        --task-grid-gap: 10px;
      }
      .main.has-detail .list-panel {
        --task-grid-columns: 18px 42px minmax(150px, 1fr) 76px 56px minmax(112px, 124px) 84px;
        --task-grid-gap: 7px;
        --task-grid-padding-x: 10px;
        padding-right: 12px;
        padding-left: 12px;
      }
      .status-badge { width: 58px; min-width: 58px; }
      .main.has-detail .status-badge { width: 56px; min-width: 56px; }
    }
    @media (min-width: 861px) and (max-width: 1100px) {
      .main.has-detail { grid-template-columns: minmax(300px, 1fr) minmax(270px, 290px); gap: 10px; }
      .main.has-detail .task-table-header { display: none; }
      .main.has-detail .task-row {
        grid-template-columns: 18px 42px minmax(0, 1fr) auto;
        row-gap: 9px;
        column-gap: 9px;
        min-height: 0;
        padding: 12px 10px;
      }
      .main.has-detail .task-info { grid-column: 3 / 5; }
      .main.has-detail .task-traffic { grid-column: 3 / 4; justify-self: start; flex-direction: row; }
      .main.has-detail .task-created-time { grid-column: 3 / 4; justify-self: start; }
      .main.has-detail .status-badge { grid-column: 4; justify-self: end; }
      .main.has-detail .task-actions { grid-column: 1 / 5; justify-self: stretch; justify-content: flex-end; }
    }
    @media (max-width: 860px) {
      .task-actions-bar { min-height: 54px; padding: 10px 12px; overflow-x: auto; }
      .task-actions-title { display: none; }
      .task-actions-bar .queue-actions { width: max-content; flex-shrink: 0; }
      .queue-header { gap: 9px; padding-bottom: 10px; }
      .queue-actions { justify-content: flex-start; overflow-x: auto; padding-bottom: 2px; }
      .list-panel { min-height: auto; overflow: visible; padding: 0 12px 12px; border-radius: 12px; }
      .task-table { flex: 0 0 auto; overflow: visible; scrollbar-gutter: auto; }
      .task-table-header { display: none; }
      .task-row { grid-template-columns: 18px 44px minmax(0, 1fr) auto; row-gap: 9px; column-gap: 10px; min-height: 0; padding: 12px; }
      .task-info, .task-progress { grid-column: 3 / 5; }
      .task-progress { max-width: none; }
      .task-traffic { grid-column: 3 / 4; }
      .task-created-time { grid-column: 3 / 4; justify-self: start; }
      .status-badge { grid-column: 4; justify-self: end; }
      .task-actions { grid-column: 1 / 5; justify-self: stretch; justify-content: flex-end; }
    }

    /* Keep the live RPC connection state in the sidebar. */
    .sidebar-connection {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      margin-top: auto;
      margin-bottom: 12px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg3);
      color: var(--text-2);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar-connection .connection-label { overflow: hidden; text-overflow: ellipsis; }
    .sidebar-connection .status-dot { width: 8px; height: 8px; }
    body.sidebar-collapsed .sidebar-connection { justify-content: center; padding: 0; }
    body.sidebar-collapsed .sidebar-connection .connection-label { display: none; }
    .sidebar-utility {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .sidebar-utility .sidebar-link { min-height: 48px; padding: 0 14px; }
    .sidebar-utility .sidebar-link:hover { background: var(--bg3); }
    .sidebar-utility .sidebar-connection {
      margin: 0;
      padding: 0 14px;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      font-size: 14px;
    }
    .sidebar-connection { justify-content: space-between; }
    .connection-title,
    .connection-state { display: inline-flex; align-items: center; min-width: 0; }
    .connection-title { gap: 13px; color: var(--text-2); }
    .connection-title svg { width: 20px; height: 20px; flex: 0 0 20px; color: var(--text-2); }
    .connection-state { gap: 0; margin-left: auto; color: var(--text-3); }
    .connection-state .connection-label { display: none; }
    .sidebar .filter-btn.active,
    .sidebar .sidebar-link.active,
    .sidebar .sidebar-link[aria-current="page"] {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 650;
    }
    .sidebar .filter-btn.active:hover,
    .sidebar .sidebar-link.active:hover,
    .sidebar .sidebar-link[aria-current="page"]:hover {
      background: var(--accent-bg);
      color: var(--accent);
    }
    .sidebar .filter-btn:focus-visible,
    .sidebar .sidebar-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .sidebar .sidebar-link.active .connection-title,
    .sidebar .sidebar-link[aria-current="page"] .connection-title,
    .sidebar .sidebar-link.active .connection-title svg,
    .sidebar .sidebar-link[aria-current="page"] .connection-title svg {
      color: var(--accent);
    }
    .sidebar-bottom { margin-top: auto; }
    body.sidebar-collapsed .sidebar-utility { padding: 0; }
    body.sidebar-collapsed .sidebar-utility .sidebar-link { min-height: 42px; }
    body.sidebar-collapsed .sidebar-utility .sidebar-connection { margin: 0; padding: 0; min-height: 48px; }
    body.sidebar-collapsed .sidebar-connection { justify-content: center; }
    body.sidebar-collapsed .sidebar-connection > .connection-title,
    body.sidebar-collapsed .sidebar-connection > .connection-state { display: inline-flex; }
    body.sidebar-collapsed .connection-title > span { display: none; }
    body.sidebar-collapsed .connection-state { margin-left: 0; }
    @media (max-width: 860px) { .sidebar-utility { display: none; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">
      <img src="icons/icon48.png" alt="Downlink"/>
      <span class="header-title-text" data-l10n="pageTitle">Aria2 任务管理</span>
    </div>
    <div class="header-primary-actions">
      <button class="btn primary" id="createTaskBtn"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.75a.75.75 0 0 1 .75.75v4.75h4.75a.75.75 0 0 1 0 1.5H8.75v4.75a.75.75 0 0 1-1.5 0V8.75H2.5a.75.75 0 0 1 0-1.5h4.75V2.5A.75.75 0 0 1 8 1.75Z"/></svg><span data-l10n="createTask">新建任务</span></button>
    </div>
    <div class="header-right">
      <div class="header-stats" id="headerStats">
        <div class="stat speed">
          <span class="stat-value" id="statSpeed">—</span>
          <span class="stat-label" data-l10n="statSpeedLabel">下载</span>
        </div>
        <div class="stat up">
          <span class="stat-value" id="statUpSpeed">—</span>
          <span class="stat-label" data-l10n="statUpSpeedLabel">上传</span>
        </div>
      </div>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6.5 1a5.5 5.5 0 0 1 4.38 8.82l3.65 3.65a.75.75 0 1 1-1.06 1.06l-3.65-3.65A5.5 5.5 0 1 1 6.5 1Zm0 1.5a4 4 0 1 0 0 8a4 4 0 0 0 0-8Z"/></svg>
        <input id="searchInput" type="search" placeholder="搜索文件名 / GID / 路径…" data-l10n-placeholder="searchPlaceholder"/>
      </label>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="filters" aria-label="任务分类">
        <button class="filter-btn active" data-filter="all" aria-pressed="true"><svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.5 2.5h4v4h-4v-4Zm7 0h4v4h-4v-4Zm-7 7h4v4h-4v-4Zm7 0h4v4h-4v-4Z"/></svg><span data-l10n="filterAll">全部任务</span></button>
        <button class="filter-btn" data-filter="active"><svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.2a.75.75 0 0 1 .75.75v8.24l2.02-2.02a.75.75 0 0 1 1.06 1.06l-3.3 3.3a.75.75 0 0 1-1.06 0l-3.3-3.3a.75.75 0 1 1 1.06-1.06l2.02 2.02V1.95A.75.75 0 0 1 8 1.2Z"/></svg><span data-l10n="filterActive">下载中</span></button>
        <button class="filter-btn" data-filter="waiting"><svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 1.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm.75 1.75v2.94l2.05 1.23a.75.75 0 0 1-.77 1.29L7.6 8.25a.75.75 0 0 1-.35-.64V4.75a.75.75 0 0 1 1.5 0Z"/></svg><span data-l10n="filterWaiting">等待中</span></button>
        <button class="filter-btn" data-filter="paused"><svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4.25 2.25h2.1v11.5h-2.1V2.25Zm5.4 0h2.1v11.5h-2.1V2.25Z"/></svg><span data-l10n="filterPaused">已暂停</span></button>
        <button class="filter-btn" data-filter="stopped"><svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.25a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5Zm3.3 5.15-3.8 3.8a.75.75 0 0 1-1.06 0L4.7 8.47a.75.75 0 0 1 1.06-1.06l1.21 1.21 3.27-3.28a.75.75 0 1 1 1.06 1.06Z"/></svg><span data-l10n="filterStopped">已完成</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-utility">
      <button class="sidebar-link sidebar-connection" id="rpcConnectionLink" type="button" aria-controls="settingsView" aria-label="RPC 连接状态">
        <span class="connection-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span data-l10n="rpcConnection">RPC 连接</span>
        </span>
        <span class="connection-state">
          <span class="status-dot" id="statusDot"></span>
          <span class="connection-label" id="statusText">检测中…</span>
        </span>
      </button>
      <button class="sidebar-link" id="globalSettingsBtn" type="button" aria-controls="settingsView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span data-l10n="globalSettings">全局设置</span></button>
      </div>
      <div class="sidebar-bottom">
        <button class="collapse-hint" id="sidebarToggleBtn" type="button" aria-expanded="true" title="收起侧边栏">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9.97 3.47a.75.75 0 0 1 0 1.06L6.5 8l3.47 3.47a.75.75 0 1 1-1.06 1.06L4.91 8.53a.75.75 0 0 1 0-1.06l4-4a.75.75 0 0 1 1.06 0Z"/></svg>
          <span>收起侧边栏</span>
        </button>
      </div>
    </aside>
    <div class="workspace">
  <section class="settings-view" id="settingsView" aria-hidden="true">
    <iframe class="settings-frame" id="settingsFrame" src="aria2-settings.html?embedded=1" title="Aria2 全局设置"></iframe>
  </section>
  <section class="settings-view" id="createTaskView" aria-hidden="true">
    <iframe class="settings-frame" id="createTaskFrame" src="aria2-create-task.html?embedded=1" title="新建下载任务"></iframe>
  </section>
  <div class="alert" id="alert"></div>

  <div class="task-actions-bar">
    <span class="task-actions-title" data-l10n="queueTitle">任务队列</span>
    <div class="queue-actions">
      <button class="btn" id="pauseAllBtn" data-l10n="pauseAll">全部暂停</button>
      <button class="btn" id="resumeAllBtn" data-l10n="resumeAll">全部继续</button>
      <button class="btn danger" id="purgeBtn" data-l10n="purgeAll">清除已完成</button>
      <button class="btn primary" id="refreshBtn" data-l10n="refresh">刷新</button>
    </div>
  </div>
  <main class="main" id="taskWorkspace">
    <section class="list-panel">
      <div class="task-table-header" aria-hidden="true">
        <span class="task-header-name" data-l10n="fileNameColumn">文件名</span>
        <span class="task-header-speed" data-l10n="speedColumn">速度</span>
        <span class="task-header-status" data-l10n="stateColumn">状态</span>
        <span class="task-header-created-time" data-l10n="createdTimeColumn">创建时间</span>
        <span class="task-header-actions" data-l10n="actionsColumn">操作</span>
      </div>
      <div class="task-table" id="taskList"></div>
    </section>

    <aside class="detail-panel" id="detailPanel" aria-hidden="true">
      <div class="detail-header">
        <h2 id="detailTitle" data-l10n="selectTaskHint">选择一个任务查看详情</h2>
        <button class="detail-close" id="detailCloseBtn" data-l10n="close">关闭</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-actions" id="detailActions"></div>
    </aside>
  </main>
    </div>
  </div>

  <footer class="footer">
    <span id="rpcEndpoint">—</span>
    <span class="spacer"></span>
    <span data-l10n="autoRefreshNote">自动刷新：3 秒</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="aria2-tasks.js"></script>
</body>
</html>
