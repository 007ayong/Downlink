<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建下载任务</title><style>:root{color-scheme:light dark;--bg:#f5f4f0;--panel:#fff;--field:#eeede9;--border:#dddcda;--text:#1c1b19;--muted:#5a5955;--subtle:#9b9a97;--accent:#e05c2a;--accent-bg:#fdf0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(900px,calc(100% - 36px));margin:0 auto;padding:32px 0 64px}.top{display:flex;align-items:center;gap:16px;margin-bottom:30px}.back,.btn{border:1px solid var(--border);border-radius:9px;background:var(--field);color:var(--text);padding:9px 13px;font:inherit;cursor:pointer}.back{color:var(--muted)}.eyebrow{font-size:10px;color:var(--accent);font-weight:750;letter-spacing:.12em}.top h1{margin:3px 0 0;font-size:24px;letter-spacing:-.03em}.lead{margin:7px 0 0;color:var(--muted)}.card{border:1px solid var(--border);background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.07);border-radius:15px;overflow:hidden}.head{padding:21px 24px;border-bottom:1px solid var(--border)}.head h2{margin:0;font-size:16px}.head p{margin:6px 0 0;color:var(--muted);font-size:12px}.form{padding:22px 24px}.field{display:flex;flex-direction:column;gap:8px;min-width:0;margin-bottom:20px}.field label{font-weight:650;font-size:13px}.field small{color:var(--subtle);font-size:11px;line-height:1.45}input[type=number]{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--field);color:var(--text);padding:11px;outline:none;font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}.settings-row{display:flex;gap:18px;align-items:flex-start;min-width:0}.settings-row>.field{flex:1 1 0;width:0}.location-picker{position:relative;width:100%}.location-trigger{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--field);color:var(--text);font:inherit;text-align:left;cursor:pointer}.location-trigger:focus,.location-trigger.open{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}.location-dot{width:9px;height:9px;border-radius:50%;background:var(--location-color,var(--subtle));flex:0 0 auto}.location-trigger-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.location-trigger-arrow{margin-left:auto;color:var(--subtle);font-size:11px}.location-menu{display:none;position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:100%;padding:5px;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:0 14px 28px rgba(0,0,0,.16)}.location-menu.open{display:block}.location-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}.location-option:hover,.location-option.active{background:var(--accent-bg)}.location-option-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.location-option-default{margin-left:auto;color:var(--subtle);font-size:10px;white-space:nowrap}.save-location-path-display{display:block;width:100%;min-width:0;padding:1px 0;color:var(--subtle);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{display:flex;gap:10px;margin:2px 0 20px;padding:11px 12px;border-radius:9px;background:var(--accent-bg);color:var(--muted);font-size:12px;line-height:1.45}.hint strong{color:var(--accent)}.actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:9px;padding:9px 14px;opacity:0;transition:opacity .2s;pointer-events:none}@media(prefers-color-scheme:dark){:root{--bg:#292b31;--panel:rgba(58,60,68,.98);--field:rgba(255,255,255,.09);--border:rgba(255,255,255,.16);--text:#f5f4f2;--muted:#d5d3ce;--subtle:#a5a39d;--accent:#ff8a5c;--accent-bg:#42271e}.card{box-shadow:0 12px 30px rgba(0,0,0,.16)}}@media(max-width:600px){.shell{width:min(100% - 24px,900px);padding-top:18px}.settings-row{display:grid;grid-template-columns:1fr}.settings-row>.field{width:100%}.top h1{font-size:21px}}.uri-editor{display:flex;border:1px solid var(--border);border-radius:10px;background:var(--field);overflow:hidden}.uri-editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}.uri-input{flex:1;min-width:0;min-height:220px;max-height:60vh;padding:12px 14px;overflow-y:auto;resize:vertical;outline:none;color:var(--text);font:inherit;line-height:1.6;cursor:text}.uri-input:empty::before{content:attr(data-placeholder);color:var(--subtle);pointer-events:none}.uri-line{display:flex;align-items:flex-start;gap:10px}.uri-line+.uri-line{margin-top:14px}.uri-no{flex:0 0 auto;min-width:2ch;padding-top:1px;color:var(--subtle);font:inherit;line-height:1.6;text-align:right;user-select:none;-webkit-user-select:none}.uri-text{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;outline:none}.uri-line:focus-within .uri-no{color:var(--accent)}body.embedded{overflow-y:auto}body.embedded .top{display:none}body.embedded .shell{min-height:100%;padding:26px 0 48px}</style></head>
<body><main class="shell"><header class="top"><button class="back" id="back">← 任务队列</button><div><div class="eyebrow">ARIA2 CONSOLE / NEW DOWNLOAD</div><h1>新建下载任务</h1><p class="lead">直接将地址交给当前运行的 aria2c。</p></div></header><section class="card"><div class="head"><h2>下载来源</h2><p>支持 HTTP、HTTPS、FTP、磁力链接与 aria2c 能处理的其他链接。</p></div><form class="form" id="form"><div class="field"><label for="uris">下载链接</label><div class="uri-editor"><div class="uri-input" id="uris" spellcheck="false" data-placeholder="https://example.com/release.iso / magnet:?xt=urn:btih:..."></div></div><small>每行一个链接；多行会创建多个独立下载任务。</small></div><div class="hint"><strong>⌁</strong><span>同一文件的多个镜像地址请放在同一行，并以空格分隔；多行用于创建不同任务。</span></div><div class="settings-row"><div class="field"><label>保存位置</label><div class="location-picker" id="saveLocations"><button class="location-trigger" id="saveLocationsTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="location-dot"></span><span class="location-trigger-text">使用 aria2 默认目录</span><span class="location-trigger-arrow">▾</span></button><div class="location-menu" id="saveLocationsMenu" role="listbox"></div></div><div class="save-location-path-display" id="saveLocationsPath">使用 aria2 默认目录。</div><small id="saveLocationsHelp">在全局设置中管理保存位置列表。</small></div><div class="field"><label for="connections">单任务连接数（可选）</label><input id="connections" type="number" min="1" max="16" step="1" inputmode="numeric" placeholder="使用 aria2 默认值" aria-describedby="connectionsHint"><small id="connectionsHint">范围 1–16，建议 4–8；留空使用全局默认值。实际连接数取决于文件大小与服务器支持，仅适用于 HTTP/HTTPS/FTP。</small></div></div><div class="actions"><button class="btn" type="button" id="clear">清空</button><button class="btn primary" type="submit" id="submit">加入下载队列</button></div></form></section></main><div class="toast" id="toast"></div><script src="aria2-create-task.js"></script></body></html>
