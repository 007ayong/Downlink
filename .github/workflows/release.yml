name: GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Build Chromium release package
        id: package
        run: echo "chromium_zip=$(node scripts/package-extension.mjs chromium)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.chromium_zip }}
          generate_release_notes: true

  sign-firefox:
    runs-on: ubuntu-latest
    needs: release-chromium
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Firefox extension source
        id: package
        run: echo "firefox_source_dir=$(node scripts/package-extension.mjs firefox --no-zip)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FIREFOX_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/downlink-firefox-updates.json

      - name: Sign Firefox self-distributed XPI
        run: |
          mkdir -p dist/firefox-signed
          npx --yes web-ext@8 sign \
            --source-dir "${FIREFOX_SOURCE_DIR}" \
            --artifacts-dir dist/firefox-signed \
            --channel unlisted \
            --timeout 900000 \
            --approval-timeout 7200000
          firefox_xpi="$(find dist/firefox-signed -maxdepth 1 -name '*.xpi' -type f | head -n 1)"
          if [ -z "${firefox_xpi}" ]; then
            echo "Signed Firefox XPI was not created" >&2
            exit 1
          fi
          version="$(node -p "require('./manifest.json').version")"
          release_xpi="dist/downlink-v${version}-firefox.xpi"
          mv "${firefox_xpi}" "${release_xpi}"
          node scripts/generate-firefox-update-manifest.mjs "${release_xpi}" dist/downlink-firefox-updates.json
          echo "firefox_xpi=${release_xpi}" >> "$GITHUB_OUTPUT"
          echo "firefox_updates=dist/downlink-firefox-updates.json" >> "$GITHUB_OUTPUT"
        id: sign-firefox
        env:
          FIREFOX_SOURCE_DIR: ${{ steps.package.outputs.firefox_source_dir }}
          RELEASE_TAG: ${{ github.ref_name }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload signed Firefox XPI and update manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.sign-firefox.outputs.firefox_xpi }}
            ${{ steps.sign-firefox.outputs.firefox_updates }}
