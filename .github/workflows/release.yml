name: GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Build release packages
        id: package
        run: |
          chromium_zip="$(node scripts/package-extension.mjs chromium)"
          firefox_zip="$(node scripts/package-extension.mjs firefox)"
          {
            echo "chromium_zip=${chromium_zip}"
            echo "firefox_zip=${firefox_zip}"
          } >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.chromium_zip }}
            ${{ steps.package.outputs.firefox_zip }}
          generate_release_notes: true
