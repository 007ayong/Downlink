name: Publish to Edge Add-ons

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to publish (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Build release zip
        id: package
        run: echo "zip_path=$(node scripts/package-extension.mjs)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}

      - name: Publish to Microsoft Edge Add-ons
        run: node scripts/publish-edge.mjs "${ZIP_PATH}"
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
